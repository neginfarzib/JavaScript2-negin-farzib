<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="icon" type="image/png" sizes="10x10" href="../assets/butterfly-icon.svg">
    <link rel="stylesheet" href="../styles/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body class="min-vh-100 d-flex flex-column">
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light ">
            <div class="container-fluid my-navbar-container">
                <a class="navbar-brand" href="../index.html">
                    <img src="../assets/butterfly-icon.svg" alt="Logo" width="30" height="30" class="me-2">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="../post/manage-all-post.html">All My

                    </ul>
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link active" href="../account/profile.html"

    <script>
        let name = localStorage.getItem('name');

        const userNameElement = document.getElementById('user-name');
        if (userNameElement) {
            userNameElement.textContent = name;
        }

    <script type="module" src="../js/manage-all-post-main.js"></script>
