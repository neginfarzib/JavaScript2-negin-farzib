<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login | Butterfly Forum</title>
    <meta name="description" content="">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="10x10" href="../assets/butterfly-icon.svg">
    <link rel="stylesheet" href="../styles/css/style.css">
    <script>
        localStorage.removeItem('accessToken');
        localStorage.removeItem('name');
    </script>
</head>

<body class="min-vh-100 d-flex flex-column">
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid my-navbar-container">
                <a class="navbar-brand" href="../index.html">
                    <img src="../assets/butterfly-icon.svg" alt="Logo" width="30" height="30" class="me-2">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">All MyPosts</a></li>

                    </ul>
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link active" href="#">Sign in</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Register</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card shadow p-4 mb-3 login-box">
            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input class="form-control" type="email" id="email" pattern="^[a-zA-Z0-9._%+\-]+@stud\.noroff\.no$"
                        title="The email value must be a valid stud.noroff.no email address" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input class="form-control" type="password" id="password" minlength="8"
                        title="Password must be at least 8 characters long." required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-5">Sign in</button>
                <div class="row">
                    <p id="errorMessage"></p>
                </div>
                <div class="text-center mt-1">
                    <a href="register.html">Don’t have an account? Register Now!</a>
                </div>
            </form>
        </div>
    </main>
    <div class="bg-primary mt-auto">
        <footer class="container-fluid text-white py-4">
            <p class="text-dark">Home</p>
        </footer>
    </div>

    <script type="module" src="../js/login-main.js"></script>
</body>

</html>
